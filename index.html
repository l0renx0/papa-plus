<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Papà+">
<title>Papà+</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: una colonna stile telefono, carte grandi che si girano al tocco */
:root{
  --bg:#f1f4f9; --surface:#ffffff; --text:#0f1729; --muted:#4a5568; --line:#d5dbe7;
  --primary:#1f4fd1; --primary-ink:#ffffff; --primary-soft:#e4ebff;
  --danger:#c62828; --danger-soft:#fdeaea; --ok:#1b7a3d; --ok-soft:#e3f5ea; --warn-soft:#fff4d6;
  --shadow:0 2px 10px rgba(15,23,41,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220; --surface:#182033; --text:#f2f5fb; --muted:#b4bdd0; --line:#2c3650;
    --primary:#7b9cff; --primary-ink:#0b1120; --primary-soft:#1f2a47;
    --danger:#ff7676; --danger-soft:#3a1f24; --ok:#5fd68b; --ok-soft:#173226; --warn-soft:#3a321a;
    --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#182033; --text:#f2f5fb; --muted:#b4bdd0; --line:#2c3650;
  --primary:#7b9cff; --primary-ink:#0b1120; --primary-soft:#1f2a47;
  --danger:#ff7676; --danger-soft:#3a1f24; --ok:#5fd68b; --ok-soft:#173226; --warn-soft:#3a321a;
  --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;
}
html{font-size:19px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-size="l"]{font-size:22px}
html[data-size="xl"]{font-size:25px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
h1{font-size:1.6rem;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}

/* Top */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:56px}
.top h1{flex:1}
.icon-btn{min-width:56px;height:56px;border-radius:16px;display:flex;align-items:baseline;justify-content:center;padding-top:14px!important;background:var(--surface);
  box-shadow:var(--shadow);font-weight:800;font-size:1.05rem;padding:0 12px}
.lead{color:var(--muted);margin-bottom:18px;font-size:1.05rem}
.back{display:flex;align-items:center;gap:6px;font-size:1.1rem;font-weight:700;color:var(--primary);min-height:56px;padding-right:12px}
.back svg{width:28px;height:28px}

.section-t{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px}
.list{display:flex;flex-direction:column;gap:18px}

/* Flip card */
.flip{perspective:1400px;width:100%;max-width:100%;cursor:pointer;border-radius:22px}
.flip-inner{position:relative;width:100%;aspect-ratio:1.586;transition:transform .7s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;color:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 10px 24px rgba(10,20,40,.22);display:flex;flex-direction:column}
.face.rear{transform:rotateY(180deg)}
.flip:not(.on) .rear,.flip.on .front{pointer-events:none}
.front{padding:20px;justify-content:space-between}
.front::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.front>*{position:relative;z-index:1}
.f-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.f-type{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.f-name{font-size:1.45rem;font-weight:800;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.f-num{font-size:1.1rem;letter-spacing:.12em;font-variant-numeric:tabular-nums;font-weight:600}
.chip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#f4d98b,#c9a54a);flex:none}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:800;background:rgba(255,255,255,.24);
  padding:7px 12px;border-radius:999px;white-space:nowrap}
.hint svg{width:18px;height:18px}
.big-ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.big-ic svg{width:30px;height:30px}

/* Back */
.stripe{height:30px;background:#111;margin-top:18px;flex:none}
.back-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 18px 16px;gap:8px}
.b-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b-label{font-weight:800;font-size:.95rem;opacity:.95}
.edit-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);color:#fff;font-weight:800;
  font-size:.85rem;padding:8px 12px;border-radius:999px;min-height:40px}
.edit-pill svg{width:18px;height:18px}
.digits{display:flex;justify-content:center;gap:8px}
.digit{width:min(56px,calc((100% - 40px)/6));aspect-ratio:.78;border-radius:12px;background:#fff;color:#0f1729;
  display:grid;place-items:center;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cred{background:rgba(255,255,255,.95);color:#0f1729;border-radius:12px;padding:8px 12px}
.cred small{display:block;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#4a5568}
.cred b{display:block;font-size:1.1rem;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;line-height:1.25}
.under{text-align:center;color:var(--muted);font-weight:600;font-size:.92rem;margin-top:8px;min-height:1.3em}
.under b{color:var(--primary)}
.empty-code{background:rgba(255,255,255,.95);color:#0f1729;border-radius:12px;padding:12px;text-align:center;font-weight:700}

/* Buttons & forms */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:18px;
  font-size:1.1rem;font-weight:800;padding:12px 18px}
.btn:active{transform:scale(.98)}
.btn svg{width:1.4em;height:1.4em}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-dashed{border:3px dashed var(--line);color:var(--primary);background:transparent}
label.lbl{display:block;font-weight:800;margin:20px 0 8px;font-size:1.05rem}
.input{width:100%;min-height:62px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:1.2rem;padding:12px 16px}
.input:focus{border-color:var(--primary);outline:none}
.input.code{font-size:2rem;letter-spacing:.35em;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:52px;padding:10px 18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.swatch{width:56px;height:56px;border-radius:16px;border:4px solid transparent;display:grid;place-items:center}
.swatch.sel{border-color:var(--text)}
.swatch svg{width:28px;height:28px;color:#fff}
.swatch.ink svg{color:#0f1729}
.face.ink{color:#10204a}
.face.ink .hint,.face.ink .edit-pill{background:rgba(16,32,74,.12);color:#10204a}
.face.ink .big-ic{background:rgba(16,32,74,.12)}
.face.ink .f-name{text-shadow:none}
.face.ink.front::after{background:rgba(255,255,255,.28)}
.msg{min-height:1.5em;color:var(--danger);font-weight:800;text-align:center;margin:14px 0 8px}
.tile{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);
  width:100%;text-align:left;min-height:96px}
.tile .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.tile .ic svg{width:32px;height:32px}
.tile b{font-size:1.15rem}
.chev{color:var(--muted);flex:none}.chev svg{width:28px;height:28px;display:block}
.example{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border-radius:16px;padding:14px 16px;font-size:.95rem;margin-bottom:18px}
.example svg{width:24px;height:24px;flex:none;margin-top:1px}
.example button{color:var(--primary);font-weight:800;text-decoration:underline;padding:0}

.overlay{position:fixed;inset:0;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:448px;display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:1.3rem}
.toast{position:fixed;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:800;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.flip-inner{transition:none}}

/* Pannello sotto la carta di credito */
.digits.d8{gap:5px}
.digits.d8 .digit{width:calc((100% - 35px)/8);font-size:1.7rem;border-radius:9px}
.xnote{font-size:.9rem;color:var(--muted);padding:10px 0 12px}
.cie-back .back-body{padding:10px 14px 12px;gap:4px;justify-content:center}
.cie-back .back-body>*{flex:none}
.cie-back .b-row{min-height:40px}
.cie-back .edit-pill{min-height:40px;padding:5px 12px;font-size:15px}
.cie-l{font-weight:800;font-size:15px;letter-spacing:.08em}
.cie-back .digits,.cie-back .digits.d8{gap:4px}
.cie-back .digits .digit,.cie-back .digits.d8 .digit{width:calc((100% - 28px)/8);aspect-ratio:auto;height:42px;font-size:min(25px, calc((100cqw - 28px) / 8 * .75));border-radius:9px}
.cie-back .empty-code{padding:8px;font-size:16px}
.savebar{position:sticky;bottom:0;z-index:5;margin-top:24px;padding:16px 0 calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 22px)}
.savebar .msg{margin:0 0 10px;background:var(--danger-soft);border-radius:12px;padding:10px 12px}
.savebar .btn{box-shadow:0 6px 18px rgba(31,79,209,.28)}
.xpanel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px;margin-top:12px;text-align:left}
.xrow{padding:12px 0;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow small{display:block;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xrow b{display:block;font-size:1.25rem;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.xrow span{display:block;font-size:1.05rem;font-weight:600;margin-bottom:6px}

/* Pagina allarme: lista a sezioni */
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0f6e4a,#23a979);display:flex;gap:16px;align-items:center;margin:6px 0 4px}
.hero .big-ic{flex:none}
.hero h1{color:#fff}
.hero p{opacity:.92;font-weight:600}
.vlist{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.vrow{border-bottom:1px solid var(--line);padding:14px 14px 14px 16px}
.vrow:last-child{border-bottom:0}
.vrow.open{background:var(--primary-soft)}
.vhead{display:flex;align-items:center;gap:14px}
.vic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.vic svg{width:26px;height:26px}
.vlabel{flex:1;min-width:0}
.vlabel b{display:block;font-size:1.08rem;line-height:1.25;overflow-wrap:normal;word-break:normal}
.vlabel .muted{font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn svg{width:24px;height:24px;display:block;margin:auto}
.vbtn.icon{min-width:56px;padding:0}
.vbtn{min-height:52px;min-width:96px;padding:0 16px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-weight:800;flex:none}
.vbtn:active{transform:scale(.97)}
.vbtn.alt{background:var(--surface);color:var(--primary);border:2px solid var(--line)}
.vval{margin:14px 0 4px 62px;display:flex;flex-direction:column;gap:10px}
.vval .digits{justify-content:flex-start}
.vval .digit{background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(52px,calc((100% - 40px)/6))}
.vtext{font-size:1.4rem;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--surface);border-radius:12px;padding:10px 14px}
.vsmall{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{color:var(--primary);font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.linkbtn svg{width:20px;height:20px}
@media (max-width:380px){.vval{margin-left:0}}

/* ===== Rifinitura grafica ===== */
:root{
  --s-allarme:#14713f; --s-allarme-bg:#e1f4e8;
  --s-parole:#9a5a00; --s-parole-bg:#fff0d4;
  --s-app:#5d35c4; --s-app-bg:#ede6ff;
  --s-centrale:#1f4fd1; --s-centrale-bg:#e4ebff;
  --card-shadow:0 14px 28px -12px rgba(15,23,41,.45), 0 2px 6px rgba(15,23,41,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s-allarme:#6fdc9a; --s-allarme-bg:#16301f; --s-parole:#ffc561; --s-parole-bg:#36290f;
    --s-app:#b7a0ff; --s-app-bg:#2a2147; --s-centrale:#8fabff; --s-centrale-bg:#1f2a47;
    --card-shadow:0 14px 28px -12px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --s-allarme:#6fdc9a; --s-allarme-bg:#16301f; --s-parole:#ffc561; --s-parole-bg:#36290f;
  --s-app:#b7a0ff; --s-app-bg:#2a2147; --s-centrale:#8fabff; --s-centrale-bg:#1f2a47;
  --card-shadow:0 14px 28px -12px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
}

/* Intestazione */
.home-top{margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(135deg,#1f4fd1,#3a7bfd);box-shadow:0 6px 14px -6px rgba(31,79,209,.7)}
.logo svg{width:30px;height:30px}
.brand h1{font-size:1.7rem;letter-spacing:-.01em}
.plus{color:var(--primary)}
.tagline{color:var(--muted);font-size:.9rem;font-weight:600;margin-top:1px}
.size-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:64px;height:60px;
  padding:4px 10px!important;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;line-height:1}
.size-btn span{font-size:1.15rem}
.size-btn small{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.lead{display:flex;align-items:center;gap:8px}
.lead svg{width:22px;height:22px;flex:none;color:var(--primary)}

/* Carte: davanti */
.face{box-shadow:var(--card-shadow)}
.front{padding:18px 20px 18px}
.front::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 0% 100%,rgba(255,255,255,.10),transparent 60%),
             repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 12px)}
.f-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.f-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.f-ic svg{width:24px;height:24px}
.face.ink .f-ic{background:rgba(16,32,74,.12)}
.f-name{font-size:1.5rem;letter-spacing:-.01em}
.f-tap{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:.85rem;font-weight:800;
  background:rgba(255,255,255,.22);padding:7px 12px 7px 10px;border-radius:999px}
.f-tap svg{width:18px;height:18px}
.face.ink .f-tap{background:rgba(16,32,74,.12)}
.f-tap.todo{background:rgba(255,255,255,.95);color:#10204a}
.chip{width:44px;height:33px;border-radius:7px;position:relative;
  background:linear-gradient(135deg,#f6dd92,#c9a54a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip::after{content:"";position:absolute;inset:7px 9px;border:1.5px solid rgba(110,80,20,.35);border-radius:4px}
.flip:active .flip-inner{transform:scale(.985)}
.flip.on:active .flip-inner{transform:rotateY(180deg) scale(.985)}

/* Carte: dietro, con barra del tempo */
.timer{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.16)}
.timer i{display:block;height:100%;background:rgba(255,255,255,.9);transform-origin:left center}
.face.ink .timer{background:rgba(16,32,74,.12)} .face.ink .timer i{background:#10204a}
.flip.on .timer i{animation:countdown 30s linear forwards}
@keyframes countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.under{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}

/* Riquadro allarme in prima pagina */
.alarm-tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,#0e6844,#1fa673);box-shadow:var(--card-shadow);position:relative;overflow:hidden}
.alarm-tile::after{pointer-events:none;content:"";position:absolute;right:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.alarm-tile .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.alarm-tile .ic svg{width:32px;height:32px}
.alarm-tile b{font-size:1.2rem;display:block}
.alarm-tile small{display:block;opacity:.92;font-size:.92rem;font-weight:600;margin-top:2px}
.alarm-tile .chev{color:#fff;position:relative;z-index:1}
.alarm-tile:active{transform:scale(.985)}

/* Pagina allarme */
.hero{position:relative;overflow:hidden;padding:22px 20px;box-shadow:var(--card-shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hero .big-ic{width:60px;height:60px;border-radius:18px}
.hero .big-ic svg{width:34px;height:34px}
.hero p{margin-top:2px}
.jump{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.jump::-webkit-scrollbar{display:none}
.jump-b{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:.92rem;white-space:nowrap}
.jump-b svg{width:18px;height:18px}
.search{position:relative;margin-top:12px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--muted);pointer-events:none}
.search .input{padding-left:52px}
.vsec{scroll-margin-top:12px}
.vsec-h{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:1.05rem;color:var(--text);margin:28px 0 12px}
.vsec-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.vsec-ic svg{width:20px;height:20px}
.vsec-h .count{margin-left:auto;font-size:.85rem;font-weight:800;color:var(--muted);background:var(--surface);
  border-radius:999px;padding:4px 10px;box-shadow:var(--shadow)}
.s-allarme{color:var(--s-allarme);background:var(--s-allarme-bg)}
.s-parole{color:var(--s-parole);background:var(--s-parole-bg)}
.s-app{color:var(--s-app);background:var(--s-app-bg)}
.s-centrale{color:var(--s-centrale);background:var(--s-centrale-bg)}
.vrow{padding:14px 14px 14px 14px;transition:background .2s}
.vrow.open{background:var(--primary-soft)}
.vlabel .muted .empty{font-style:italic;color:var(--muted);font-weight:600}
.vcall .addfull{width:100%;justify-content:center;min-height:52px;background:transparent;border:2px dashed var(--line);color:var(--primary)}
.vbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-width:0;padding:0 14px}
.vbtn svg{width:22px;height:22px;margin:0}
.vbtn.add{background:transparent;border:2px dashed var(--line);color:var(--primary)}
.vbtns{display:flex;gap:8px;flex:none}
.vval{margin:14px 0 2px;padding:14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.vval .digit{background:var(--primary-soft);box-shadow:none;width:min(56px,calc((100% - 40px)/6));font-size:2.1rem}
.vval .digits.d8 .digit{width:calc((100% - 35px)/8);font-size:1.6rem}
.vtext{background:var(--bg);font-size:1.35rem}
.vtimer{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.vtimer i{display:block;height:100%;background:var(--primary);transform-origin:left center;animation:countdown 30s linear forwards}
.vfoot{gap:10px;flex-direction:column;align-items:stretch}
.vacts .chipbtn{flex:1;justify-content:center}
.vlabel .muted.plain{white-space:normal;color:var(--text);font-weight:600;font-size:1rem}
.vcall{margin:12px 0 2px 62px}
/* Voce dell'allarme: nome su tutta la riga, pulsante sulla riga sotto */
.vhead{align-items:flex-start}
.vic{margin-top:2px}
.vlabel b{overflow-wrap:break-word;hyphens:manual}
.vline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.vline>.muted{flex:1 1 auto;min-width:0}
.vline .vbtn{margin-left:auto}
.vcall .chipbtn{text-decoration:none;width:100%;justify-content:center;min-height:52px;background:var(--s-centrale-bg);color:var(--s-centrale)}
@media (max-width:380px){.vcall{margin-left:0}}
.vfoot .muted{font-size:.85rem}
.vacts{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:12px;font-weight:800;
  background:var(--primary-soft);color:var(--primary)}
.chipbtn svg{width:20px;height:20px}
.toast{display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){.flip.on .timer i,.vtimer i{animation:none}}
/* Cifre che si adattano sempre alla larghezza disponibile (anche con lo zoom di Android) */
.digits{container-type:inline-size;width:100%}
.digits{--g:8px;gap:var(--g)}
.digits.d8{--g:5px}
.digits .digit,.digits.d8 .digit,.vval .digits .digit,.vval .digits.d8 .digit{
  width:min(56px, calc((100cqw - (var(--n,6) - 1) * var(--g)) / var(--n,6)));
  font-size:min(2.2rem, calc((100cqw - (var(--n,6) - 1) * var(--g)) / var(--n,6) * .68))}
.cie-back .digits.d8{--g:4px}
.cie-back .digits.d8 .digit{width:calc((100cqw - 28px) / 8);height:42px;aspect-ratio:auto;font-size:min(25px, calc((100cqw - 28px) / 8 * .75))}
.size-btn{height:auto;min-height:60px}
/* Carte che si adattano alla larghezza (telefoni stretti o zoom di Android) */
.flip{container-type:inline-size}
.flip-inner{aspect-ratio:auto;height:max(63.05cqw, 200px)}
.tap-short{display:none}
@container (max-width:330px){
  .tap-long{display:none} .tap-short{display:inline}
  .front .chip{display:none}
  .front{padding:16px}
}
.hero>div,.alarm-tile>span[style]{min-width:0}
.hero h1{overflow-wrap:break-word}
/* Titoli mai più larghi dello schermo */
h1{font-size:min(1.6rem,9vw)}
.brand h1{font-size:min(1.7rem,10vw)}
.hero h1{font-size:min(1.6rem,8.5vw)}
.tile>span[style],.alarm-tile>span[style]{min-width:0;overflow-wrap:break-word}
/* Schermi molto stretti (o zoom di Android alto) */
@media (max-width:330px){
  .tile,.alarm-tile{gap:12px;padding:14px}
  .tile .ic,.alarm-tile .ic{width:44px;height:44px;border-radius:12px}
  .tile .ic svg,.alarm-tile .ic svg{width:24px;height:24px}
  .chev svg{width:22px;height:22px}
  .hero{flex-direction:column;align-items:flex-start;gap:12px}
  .hero .big-ic{width:48px;height:48px}
  .logo{width:44px;height:44px}
  .vic{width:40px;height:40px} .vic svg{width:22px;height:22px}
  .vhead{gap:10px}
  .vcall{margin-left:0}
  .tagline{display:none}
}
/* Le carte hanno misure fisse: restano ordinate anche con il testo «Enorme» */
.front .f-type{font-size:min(.8rem,14px)}
.front .f-name{font-size:min(1.5rem,27px,10cqw)}
.front .f-tap{font-size:min(.85rem,15px);white-space:nowrap}
.rear .b-label{font-size:min(.95rem,17px)}
.rear .edit-pill{font-size:min(.85rem,15px)}
.rear .digit{font-size:min(2.2rem,38px,calc((100cqw - 40px) / 6 * .7))}
.rear .cred small{font-size:min(.72rem,12px)} .rear .cred b{font-size:min(1.1rem,19px)}
.rear .empty-code{font-size:min(1rem,17px)}
</style>

</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(() => {
'use strict';
const sv = (d, w=2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  flip: sv('<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>', 2.4),
  back: sv('<path d="M15 5l-7 7 7 7"/>', 2.6),
  next: sv('<path d="M9 5l7 7-7 7"/>', 2.6),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.8),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', 2.4),
  trash: sv('<path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/>'),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
  house: sv('<path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><rect x="10" y="13" width="4" height="7"/>'),
  person: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.4-6.5 8-6.5s7 2 8 6.5"/>'),
  card: sv('<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>'),
  idcard: sv('<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5.5 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4M14 10h4.5M14 13.5h3"/>'),
  info: sv('<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/>'),
  grid: sv('<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>', 2.6),
  key: sv('<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16 7l3 3M14 9l2 2"/>'),
  mobile: sv('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/>'),
  phone: sv('<path d="M5 3.5h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.6 6.6l1.4-2.3 4.5 1.8V19a2 2 0 0 1-2 2A17.5 17.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>'),
  doc: sv('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'),
  eye: sv('<path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/>'),
  eyeoff: sv('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 4.5c6.5 0 10.5 7.5 10.5 7.5a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 1.5 12S5.5 19.5 12 19.5a10 10 0 0 0 5.4-1.6M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/>'),
  copy: sv('<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>'),
  search: sv('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>', 2.4),
  hand: sv('<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 10.5V4a1.5 1.5 0 0 1 3 0v7M15 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.8-2.4l-3-4a1.6 1.6 0 0 1 2.5-2L9 16V11"/>'),
  at: sv('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>')
};
const COLORS = {
  blu:'linear-gradient(135deg,#1f4fd1,#3a7bfd)', verde:'linear-gradient(135deg,#0f6e4a,#23a979)',
  rosso:'linear-gradient(135deg,#b3261e,#e85a4f)', giallo:'linear-gradient(135deg,#a8690f,#e7a826)',
  viola:'linear-gradient(135deg,#5b2bb5,#8f5cf0)', postale:'linear-gradient(135deg,#ffcc00,#ffe14a)',
  azzurro:'linear-gradient(135deg,#0b6a80,#1fa2c0)', nero:'linear-gradient(135deg,#1c1f26,#4a5060)'
};
const INK = c => c === 'postale' ? ' ink' : '';
const CARD_TYPES = ['Bancomat','Carta di credito','Altra carta'];
const isCredit = it => it.kind === 'card' && it.type === 'Carta di credito';

/* Allarme: sezioni e tipi di voce */
const ALARM = 'Verisure';
const VSECTIONS = [
  ['allarme', "Codici dell'allarme", 'grid', 'Codici'],
  ['parole', 'Parole chiave', 'key', 'Parole chiave'],
  ['app', 'App e accesso online', 'mobile', 'App'],
  ['centrale', 'Centrale e contratto', 'phone', 'Centrale']
];
const VTYPES = {
  code:  {label:'Codice numerico', icon:'grid', secret:true},
  pass:  {label:'Password o parola', icon:'key', secret:true},
  login: {label:'Utente e password', icon:'person', secret:true},
  phone: {label:'Numero di telefono', icon:'phone', secret:false},
  text:  {label:'Altro', icon:'doc', secret:false}
};

const FLIP_BACK_S = 30, KEY = 'imieicodici.v4', PREF = 'imieicodici.prefs';
const SEED = { example:true,
  items:[
    {id:'b1', kind:'card', name:'Bancomat', type:'Bancomat', color:'blu', code:'58204'},
    {id:'c1', kind:'card', name:'Carta di credito', type:'Carta di credito', color:'nero',
      nexiPass:'Mare-Blu-58', question:'Come si chiamava il tuo primo cane?', answer:'Fido', key6:'418273'},
    {id:'i1', kind:'cie', name:"Carta d'identità", color:'azzurro', pin:'12345678', puk:'87654321', number:'CA12345AB'},
    {id:'io1', kind:'app', name:'App IO', color:'viola', code:'246810'}
  ],
  alarm:[
    {id:'v1', sec:'allarme', type:'code', label:'Attivazione/Disattivazione', value:'4729'},
    {id:'v2', sec:'allarme', type:'code', label:'Antisequestro', value:'5830'},
    {id:'p1', sec:'parole', type:'pass', label:'Cliente', value:'Girasole'},
    {id:'p2', sec:'parole', type:'pass', label:'Verisure', value:'Montagna'},
    {id:'p3', sec:'parole', type:'pass', label:'Antisequestro', value:'Tramonto'},
    {id:'v3', sec:'app', type:'login', label:'App My Verisure', user:'mario.rossi', value:'Casa-Sicura-21'},
    {id:'v4', sec:'centrale', type:'phone', label:'Numero della centrale', value:'800 000 000'},
    {id:'v5', sec:'centrale', type:'text', label:'Codice Cliente (Nr. Impianto/Contratto)', value:'VS-1234567'}
  ]
};

const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? null); } catch { return mem[k] ?? null; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DEMO = false;
function freshData(){
  const d = JSON.parse(JSON.stringify(SEED));
  if (DEMO) return d;
  d.example = false;
  d.items.forEach(i => ['code','nexiPass','question','answer','key6','pin','puk','number','user','pass'].forEach(f => { if (f in i) i[f] = ''; }));
  d.alarm.forEach(v => { v.value = ''; if ('user' in v) v.user = ''; });
  return d;
}
const D = store.get(KEY) || freshData();
/* Lo SPID preimpostato non è più in prima pagina: lo tolgo se non contiene dati (si può riaggiungere da «Aggiungi») */
if (!D.noSpid){
  const sp = D.items.find(i => i.id === 's1');
  if (sp && (D.example || !(sp.user || sp.pass))) D.items = D.items.filter(i => i !== sp);
  D.noSpid = true; store.set(KEY, D);
}
/* Allarme: la prima voce ora si chiama «Attivazione/Disattivazione» */
{ const v1 = D.alarm.find(v => v.id === 'v1');
  if (v1 && v1.label === "Codice per spegnere l'allarme"){ v1.label = 'Attivazione/Disattivazione'; store.set(KEY, D); }
  /* La seconda voce ora è il codice «Antisequestro» */
  const v2 = D.alarm.find(v => v.id === 'v2');
  if (v2 && v2.label === "Parola d'ordine per la centrale"){
    v2.label = 'Antisequestro';
    if (D.example) v2.value = '5830';
    if (!v2.value || /^\d+$/.test(v2.value)) v2.type = 'code';
    store.set(KEY, D);
  }
  /* «Numero di contratto» diventa «Codice Cliente (Nr. Impianto/Contratto)» */
  const v5 = D.alarm.find(v => v.id === 'v5');
  if (v5 && v5.label === 'Numero di contratto'){ v5.label = 'Codice Cliente (Nr. Impianto/Contratto)'; store.set(KEY, D); }
  /* Sezione «Parole chiave»: cliente, Verisure, antisequestro (aggiunta una volta sola) */
  if (!D.hasParole){
    const words = [['p1','Cliente','Girasole'],['p2','Verisure','Montagna'],['p3','Antisequestro','Tramonto']];
    const at = D.alarm.findIndex(v => v.sec !== 'allarme'); const add = [];
    words.forEach(([id, label, demo]) => { if (!D.alarm.some(v => v.id === id)) add.push({id, sec:'parole', type:'pass', label, value: D.example ? demo : ''}); });
    D.alarm.splice(at < 0 ? D.alarm.length : at, 0, ...add);
    D.hasParole = true; store.set(KEY, D);
  }
  /* App My Verisure: utente al posto dell'email negli esempi */
  const v3 = D.alarm.find(v => v.id === 'v3');
  if (v3 && D.example && v3.user === 'mario.rossi@email.it'){ v3.user = 'mario.rossi'; store.set(KEY, D); } }
/* Nuova voce: codice di sblocco dell'app IO (aggiunta una volta sola, anche sui telefoni che hanno già l'app) */
if (!D.hasIo){
  if (!D.items.some(i => i.id === 'io1')) D.items.push({id:'io1', kind:'app', name:'App IO', color:'viola', code: DEMO ? '246810' : ''});
  D.hasIo = true; store.set(KEY, D);
}
const save = () => store.set(KEY, D);
const prefs = Object.assign({size:'m'}, store.get(PREF) || {});
document.documentElement.dataset.size = prefs.size;

const S = { screen:'home', flipped:null, vopen:null, draft:null, msg:'', dialog:null, ret:'home', q:'' };
const $app = document.getElementById('app');
const wrapSlash = s => esc(s).replace(/\//g, '/<wbr>');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const uid = () => Math.random().toString(36).slice(2,10);
const byId = id => D.items.find(i => i.id === id);
const vById = id => D.alarm.find(i => i.id === id);
const digits = (code, label) => `<div class="digits${code.length > 6 ? ' d8' : ''}" style="--n:${Math.max(code.length, 4)}" aria-label="${label} ${esc(code.split('').join(' '))}">${code.split('').map(d=>`<span class="digit">${esc(d)}</span>`).join('')}</div>`;
function toast(t){ const el = document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }

/* ---------- Carte che si girano ---------- */
function front(it){
  const bg = COLORS[it.color] || COLORS.blu;
  const type = it.kind === 'card' ? it.type : it.kind === 'cie' ? "Carta d'identità elettronica" : it.kind === 'app' ? 'Codice di sblocco' : 'Email e password';
  const icon = it.kind === 'cie' ? 'idcard' : it.kind === 'app' ? 'mobile' : it.kind === 'login' ? 'person' : 'card';
  const what = (isCredit(it) || it.kind === 'cie') ? 'i codici' : it.kind === 'login' ? 'email e password' : 'il codice';
  const chip = (it.kind === 'card' || it.kind === 'cie') ? '<span class="chip"></span>' : '<span></span>';
  const empty = it.kind === 'cie' ? !(it.pin || it.puk) : isCredit(it) ? !(it.nexiPass || it.question || it.answer || it.key6)
              : it.kind === 'login' ? !(it.user || it.pass) : !it.code;
  const tap = empty ? `<span class="f-tap todo">${I.plus}${it.kind === 'cie' || isCredit(it) ? 'Codici da inserire' : 'Codice da inserire'}</span>`
                    : `<span class="f-tap">${I.hand}<span class="tap-long">Tocca per vedere ${what}</span><span class="tap-short">Tocca qui</span></span>`;
  return `<div class="face front${INK(it.color)}" style="background:${bg}">
      <div class="f-row"><span class="f-type">${esc(type)}</span><span class="f-ic">${I[icon]}</span></div>
      ${chip}
      <div><div class="f-name">${esc(it.name)}</div>${tap}</div></div>`;
}
function back(it){
  const bg = COLORS[it.color] || COLORS.blu;
  let label = 'Il codice è', body;
  if (it.kind === 'login'){
    label = esc(it.name);
    body = `<div class="cred"><small>Email</small><b>${esc(it.user) || '—'}</b></div>
            <div class="cred"><small>Password</small><b>${esc(it.pass) || '—'}</b></div>`;
  } else if (it.kind === 'cie'){
    const row = (name, code) => code ? digits(code, name) : `<div class="empty-code">${name} non inserito</div>`;
    return `<div class="face rear cie-back" style="background:${bg}">
      <div class="back-body">
        <div class="b-row"><span class="cie-l">PIN</span>
          <button class="edit-pill" data-act="edit" data-id="${it.id}">${I.edit}Modifica</button></div>
        ${row('PIN', it.pin)}
        <div class="cie-l" style="margin-top:4px">PUK</div>
        ${row('PUK', it.puk)}
      </div><div class="timer"><i></i></div></div>`;
  } else if (isCredit(it)){
    label = 'Codice Nexi Key6';
    body = it.key6 ? digits(it.key6, 'Codice Key6') : `<div class="empty-code">Codice Key6 non inserito</div>`;
  } else {
    if (it.kind === 'app') label = 'Codice di sblocco';
    body = it.code ? digits(it.code, 'Codice') : `<div class="empty-code">Nessun codice salvato.<br>Tocca «Modifica» qui sopra.</div>`;
  }
  return `<div class="face rear${INK(it.color)}" style="background:${bg}">
      ${it.kind==='card' ? '<div class="stripe"></div>' : ''}
      <div class="back-body">
        <div class="b-row"><span class="b-label">${label}</span>
          <button class="edit-pill" data-act="edit" data-id="${it.id}">${I.edit}Modifica</button></div>
        ${body}
      </div><div class="timer"><i></i></div></div>`;
}
function under(it, on){
  if (!on) return '';
  const extra = isCredit(it) ? `<div class="xpanel">
      <div class="xrow"><small>Password Nexi</small><b>${esc(it.nexiPass) || '—'}</b></div>
      <div class="xrow"><small>Domanda di sicurezza</small><span>${esc(it.question) || '—'}</span>
        <small>Risposta</small><b>${esc(it.answer) || '—'}</b></div></div>` : '';
  const cie = it.kind === 'cie' ? `<div class="xpanel">
      <div class="xrow"><small>Numero della carta</small><b>${esc(it.number) || '—'}</b></div>
      <div class="xnote">Il PIN serve per entrare con la carta d'identità (app CieID). Il PUK serve a sbloccare il PIN se si blocca.</div></div>` : '';
  return extra + cie + `<div class="under">${I.flip.replace('<svg', '<svg width="18" height="18"')}<span>Si gira da sola tra 30 secondi, oppure <b>toccala</b></span></div>`;
}
function flipCard(it){
  const on = S.flipped === it.id;
  return `<div>
    <div class="flip ${on?'on':''}" role="button" tabindex="0" data-act="flip" data-id="${it.id}"
      aria-pressed="${on}" aria-label="${esc(it.name)}: tocca per ${on?'nascondere':'vedere'} il codice">
      <div class="flip-inner">${front(it)}${back(it)}</div>
    </div>
    <div id="u-${it.id}">${under(it, on)}</div>
  </div>`;
}

/* ---------- Voci dell'allarme ---------- */
function vrow(v){
  const t = VTYPES[v.type], open = S.vopen === v.id, empty = !(v.value || v.user);
  const sub = empty ? '<span class="empty">Non ancora inserito</span>' : t.secret ? (v.type === 'login' ? esc(v.user) : '••••••') : esc(v.value);
  const editBtn = `<button class="vbtn alt icon" data-act="vedit" data-id="${v.id}" aria-label="Modifica ${esc(v.label)}">${I.edit}</button>`;
  let btns;
  if (empty) btns = '';
  else if (t.secret) btns = `<button class="vbtn ${open?'alt':''}" data-act="vshow" data-id="${v.id}" aria-expanded="${open}">${open ? 'Nascondi' : I.eye + 'Mostra'}</button>`;
  else btns = editBtn;
  const call = !empty && v.type === 'phone' ? `<a class="chipbtn call" href="tel:${esc(v.value.replace(/[^\d+]/g,''))}">${I.phone}Chiama ${esc(v.value)}</a>` : '';
  let val = '';
  if (open && t.secret){
    if (v.type === 'code') val = digits(v.value || '', 'Codice');
    else if (v.type === 'login') val = `<div><div class="vsmall">Utente</div><div class="vtext" style="font-size:1.1rem">${esc(v.user)||'—'}</div></div>
      <div><div class="vsmall">Password</div><div class="vtext">${esc(v.value)||'—'}</div></div>`;
    else val = `<div class="vtext">${esc(v.value)||'—'}</div>`;
  }
  const copy = open && v.value && v.type !== 'code' ? `<button class="chipbtn" data-act="copy" data-id="${v.id}">${I.copy}Copia</button>` : '';
  return `<div class="vrow ${open?'open':''}">
    <div class="vhead"><span class="vic s-${v.sec}">${I[t.icon]}</span>
      <div class="vlabel"><b>${wrapSlash(v.label)}</b>
        ${btns || !open ? `<div class="vline">${open ? '<span></span>' : `<span class="muted${t.secret && !empty ? '' : ' plain'}">${sub}</span>`}${btns}</div>` : ''}
      </div>
    </div>
    ${call ? `<div class="vcall">${call}</div>` : ''}
    ${empty ? `<div class="vcall"><button class="chipbtn addfull" data-act="vedit" data-id="${v.id}">${I.plus}Inserisci</button></div>` : ''}
    ${open ? `<div class="vval">${val}
      <div class="vtimer" aria-hidden="true"><i></i></div>
      <div class="vfoot"><span class="muted">Si nasconde da solo tra 30 secondi</span>
        <span class="vacts">${copy}<button class="chipbtn" data-act="vedit" data-id="${v.id}">${I.edit}Modifica</button></span></div></div>` : ''}
  </div>`;
}

    : d.kind === 'app' ? `<label class="lbl" for="f-code">Codice di sblocco</label>

    : card ? `<label class="lbl" for="f-code">Codice${d.type==='Bancomat'?' del bancomat':''}</label>
      <input class="input code" id="f-code" value="${esc(d.code)}" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="•••••">`

    <label class="lbl">Colore</label>

function render(){
  const name = S.draft ? (S.draft.name || S.draft.label) : '';
  $app.innerHTML = V[S.screen]() + (S.dialog ? `<div class="overlay" data-act="closeDlg"><div class="dialog" role="dialog" aria-modal="true">
    <h2>Eliminare «${esc(name)}»?</h2><p class="muted">Verrà cancellato da questo telefono.</p>
    <button class="btn btn-danger" data-act="doDelete">Sì, elimina</button>
    <button class="btn btn-soft" data-act="closeDlg">No, lascia stare</button></div></div>` : '');
}
function go(screen, extra={}){
  clearTimeout(flipTimer); clearTimeout(vTimer);
  Object.assign(S, {screen, msg:'', flipped:null, vopen:null}, extra);
  render(); window.scrollTo(0,0);
}

/* Giro della carta senza ridisegnare, così l'animazione resta fluida */
let flipTimer, vTimer;
function setFlip(id){
  S.flipped = id;
  document.querySelectorAll('.flip').forEach(el => {
    const on = el.dataset.id === id;
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
    const u = document.getElementById('u-'+el.dataset.id), it = byId(el.dataset.id);
    if (u && it) u.innerHTML = under(it, on);
  });
  clearTimeout(flipTimer);
  if (id) flipTimer = setTimeout(() => setFlip(null), FLIP_BACK_S*1000);
}
function readDraft(){
  const v = id => document.getElementById('f-'+id)?.value;
  const d = S.draft;
  ['name','user','pass','nexiPass','question','answer','label'].forEach(f => { const x = v(f); if (x !== undefined) d[f] = x.trim(); });
  const c = v('code'); if (c !== undefined) d.code = c.replace(/\D/g,'');
  const pn = v('pin'); if (pn !== undefined) d.pin = pn.replace(/\D/g,'').slice(0,8);
  const pk = v('puk'); if (pk !== undefined) d.puk = pk.replace(/\D/g,'').slice(0,8);
  const nb = v('number'); if (nb !== undefined) d.number = nb.trim().toUpperCase();
  const k = v('key6'); if (k !== undefined) d.key6 = k.replace(/\D/g,'').slice(0,6);
  const val = v('value'); if (val !== undefined) d.value = d.type === 'code' ? val.replace(/\D/g,'') : val.trim();
}
const fail = m => { S.msg = m; render(); };
const here = () => ['logins','alarm'].includes(S.screen) ? S.screen : 'home';

const A = {
  flip: el => { buzz(); setFlip(S.flipped === el.dataset.id ? null : el.dataset.id); },
  home: () => go('home', {q:''}),
  ret: () => go(S.ret),
  logins: () => go('logins', {q:''}),
  alarm: () => go('alarm', {q:''}),
  size: () => { prefs.size = {m:'l', l:'xl', xl:'m'}[prefs.size]; store.set(PREF, prefs); document.documentElement.dataset.size = prefs.size;
    toast({m:'Testo normale', l:'Testo grande', xl:'Testo molto grande'}[prefs.size]); },
  clearExample: () => { D.example = false; save(); render(); },
  add: () => go('add'),
  newCard: () => go('edit', {ret:'home', draft:{isNew:true, id:uid(), kind:'card', name:'', type:'Bancomat', color:'blu', code:''}}),
  newBancomat: () => go('edit', {ret:'home', draft:{isNew:true, id:uid(), kind:'card', name:'Bancomat', type:'Bancomat', color:'blu', code:''}}),
  newCredit: () => go('edit', {ret:'home', draft:{isNew:true, id:uid(), kind:'card', name:'Carta di credito', type:'Carta di credito', color:'nero', nexiPass:'', question:'', answer:'', key6:''}}),
  newApp: () => go('edit', {ret:'home', draft:{isNew:true, id:uid(), kind:'app', name:'App IO', color:'viola', code:''}}),
  newCie: () => go('edit', {ret:'home', draft:{isNew:true, id:uid(), kind:'cie', name:"Carta d'identità", color:'azzurro', pin:'', puk:'', number:''}}),
  newLogin: () => go('edit', {ret:here(), draft:{isNew:true, id:uid(), kind:'login', name:'SPID', color:'postale', user:'', pass:''}}),
  edit: el => go('edit', {ret:here(), draft:{...byId(el.dataset.id)}}),
  type: el => { readDraft(); S.draft.type = el.dataset.v; render(); },
  color: el => { readDraft(); S.draft.color = el.dataset.v; render(); },
  save: () => {
    readDraft(); const d = S.draft;
    if (!d.name) return fail('Scrivi un nome.');
    if (d.kind === 'login' && !(d.user || d.pass)) return fail("Scrivi almeno l'email o la password.");
    if (d.kind === 'cie'){
      if (!(d.pin || d.puk)) return fail('Scrivi almeno il PIN o il PUK.');
      if (d.pin && d.pin.length !== 8) return fail('Il PIN deve avere 8 numeri.');
      if (d.puk && d.puk.length !== 8) return fail('Il PUK deve avere 8 numeri.');
    } else if (isCredit(d)){
      if (!(d.nexiPass || d.question || d.answer || d.key6)) return fail('Scrivi almeno uno dei codici.');
      if (d.key6 && d.key6.length !== 6) return fail('Il codice Key6 deve avere 6 numeri.');
    } else if ((d.kind === 'card' || d.kind === 'app') && d.code.length < 4) return fail('Il codice deve avere almeno 4 numeri.');
    const {isNew, ...item} = d;
    if (isNew) D.items.push(item); else D.items = D.items.map(i => i.id === item.id ? item : i);
    save(); go(S.ret); toast('Salvato ✓');
  },
  vshow: el => {
    buzz(); S.vopen = S.vopen === el.dataset.id ? null : el.dataset.id; render();
    clearTimeout(vTimer); if (S.vopen) vTimer = setTimeout(() => { S.vopen = null; render(); }, FLIP_BACK_S*1000);
  },
  jump: el => { const t = document.getElementById('sec-' + el.dataset.v); if (t) t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); },
  copy: el => {
    const v = vById(el.dataset.id); if (!v) return;
    const done = () => { buzz(); toast('Copiato ✓'); };
    try { navigator.clipboard.writeText(v.value).then(done, () => toast('Non riesco a copiare: tieni premuto sul testo')); }
    catch { toast('Non riesco a copiare: tieni premuto sul testo'); }
  },
  vnew: () => go('vedit', {ret:'alarm', draft:{isNew:true, id:uid(), sec:'allarme', type:'code', label:'', value:'', user:''}}),
  vedit: el => go('vedit', {ret:'alarm', draft:{...vById(el.dataset.id)}}),
  vsec: el => { readDraft(); S.draft.sec = el.dataset.v; render(); },
  vtype: el => { readDraft(); const t = el.dataset.v; if (t === 'code') S.draft.value = (S.draft.value||'').replace(/\D/g,''); S.draft.type = t; render(); },
  vsave: () => {
    readDraft(); const d = S.draft;
    if (!d.label) return fail('Scrivi come si chiama.');
    if (!d.value && !(d.type === 'login' && d.user)) return fail('Manca il valore da salvare.');
    const {isNew, ...item} = d;
    if (item.type !== 'login') delete item.user;
    if (isNew) D.alarm.push(item); else D.alarm = D.alarm.map(i => i.id === item.id ? item : i);
    save(); go('alarm', {q:''}); toast('Salvato ✓');
  },
  askDelete: () => { readDraft(); S.dialog = 'delete'; render(); },
  doDelete: () => {
    const id = S.draft.id;
    if (S.screen === 'vedit') D.alarm = D.alarm.filter(i => i.id !== id); else D.items = D.items.filter(i => i.id !== id);
    save(); S.dialog = null; go(S.ret); toast('Eliminato');
  },
  closeDlg: (el, ev) => { if (el.classList.contains('overlay') && ev.target !== el) return; S.dialog = null; render(); }
};
$app.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (!a || !A[a.dataset.act]) return;
  if (a.dataset.act !== 'flip') ev.stopPropagation();
  A[a.dataset.act](a, ev);
});
$app.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList.contains('flip')){ ev.preventDefault(); A.flip(ev.target); }
});
$app.addEventListener('input', ev => {
  if (ev.target.id !== 'f-q') return;
  S.q = ev.target.value; const pos = ev.target.selectionStart; render();
  const el = document.getElementById('f-q'); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ setFlip(null); if (S.vopen){ S.vopen = null; render(); } } });
render();
})();
</script>

<script>
/* Aggiornamenti immediati: appena c'è una versione nuova, l'app si ricarica da sola */
(() => {
  const APP_VERSION = '20261127141053';
  const editing = () => !!document.querySelector('.input:not(#f-q)') || !!document.querySelector('.overlay');
  function reloadOnce(v){
    try { if (sessionStorage.getItem('papa-reload') === v) return; sessionStorage.setItem('papa-reload', v); } catch (e) {}
    location.reload();
  }
  let pending = null;
  async function check(){
    if (!navigator.onLine) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
      const v = (await r.json()).version;
      if (v && v !== APP_VERSION){ pending = v; if (!editing()) reloadOnce(v); }
    } catch (e) {}
  }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
  check();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('online', check);
  setInterval(() => { if (!document.hidden) check(); }, 60000);
  /* Se l'aggiornamento arriva mentre si scrive un codice, aspetta che abbia finito */
  document.addEventListener('click', () => setTimeout(() => { if (pending && !editing()) reloadOnce(pending); }, 300), true);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
})();
</script>
